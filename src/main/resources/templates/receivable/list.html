<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title>应收 · 梁山集团</title>
</head>
<body>
<main>
    <div class="page-head">
        <div>
            <h1>应收</h1>
            <p class="lede">未结等于调整后本金减去已确认核销，再加上已确认撤销。发票覆盖不改变未结。</p>
        </div>
        <a class="btn" th:href="@{/receivables/new}">登记应收</a>
    </div>
    <div class="panel">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>编号</th>
                    <th>用途</th>
                    <th>本金</th>
                    <th>未结</th>
                    <th>到期日</th>
                    <th>状态</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${items.isEmpty()}">
                    <td colspan="7" class="empty">还没有应收。</td>
                </tr>
                <tr th:each="item : ${items}">
                    <td th:text="${item.number}">AR-1</td>
                    <td th:text="${item.purpose}">阶段款</td>
                    <td th:text="${item.amount + ' ' + item.currency}">60000</td>
                    <td th:text="${item.outstanding == null ? '—' : item.outstanding + ' ' + item.currency}">30000</td>
                    <td th:text="${item.dueDate == null ? '—' : item.dueDate}">2026-02-09</td>
                    <td><span class="badge" th:text="${item.status}">已确认</span></td>
                    <td class="actions"><a th:href="@{/receivables/{id}/edit(id=${item.id})}">编辑</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
