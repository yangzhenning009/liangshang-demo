<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title>成本率 · 梁山集团</title>
</head>
<body>
<main>
    <div class="page-head">
        <div>
            <h1 th:text="${form.id == null} ? '新建成本率' : '编辑成本率'">成本率</h1>
            <p class="lede">同一雇佣、同一口径的有效期间不能重叠。已被工时引用的单价不能改，请另记版本。</p>
        </div>
        <a class="btn secondary" th:href="@{/labor-cost-rates}">返回列表</a>
    </div>
    <form class="panel" th:object="${form}" method="post"
          th:action="${form.id == null} ? @{/labor-cost-rates} : @{/labor-cost-rates/{id}(id=${form.id})}">
        <div class="alert" th:if="${#fields.hasErrors()}">
            <strong>请修正后再保存</strong>
            <ul>
                <li th:each="err : ${#fields.allErrors()}" th:text="${err}">错误</li>
            </ul>
        </div>
        <input type="hidden" th:field="*{id}">
        <div class="grid">
            <label class="field span-2">雇佣
                <select th:field="*{employmentId}">
                    <option value="">请选择</option>
                    <option th:each="choice : ${employmentChoices}" th:value="${choice.id}" th:text="${choice.label}"></option>
                </select>
            </label>
            <label class="field">口径
                <select th:field="*{costBasis}">
                    <option th:each="basis : ${costBases}" th:value="${basis}" th:text="${basis}"></option>
                </select>
            </label>
            <label class="field">版本号
                <input type="number" min="1" th:field="*{rateVersionNumber}" placeholder="留空则顺延">
            </label>
            <label class="field">每小时成本
                <input type="number" step="0.0001" min="0" th:field="*{hourlyCostAmount}">
            </label>
            <label class="field">币种
                <input th:field="*{currency}" placeholder="如 CNY">
            </label>
            <label class="field">开始
                <input type="date" th:field="*{validFrom}">
            </label>
            <label class="field">结束
                <input type="date" th:field="*{validTo}">
            </label>
            <label class="field">审批状态
                <select th:field="*{approvalStatus}">
                    <option th:each="status : ${approvalStatuses}" th:value="${status}" th:text="${status}"></option>
                </select>
            </label>
            <label class="field">审批人
                <select th:field="*{approvedByEmployeeId}">
                    <option value="">不选</option>
                    <option th:each="choice : ${employeeChoices}" th:value="${choice.id}" th:text="${choice.label}"></option>
                </select>
            </label>
            <label class="field">审批时间
                <input type="datetime-local" th:field="*{approvedAt}">
            </label>
            <label class="field">依据材料
                <select th:replace="~{fragments/document-select :: bound('basisDocumentId')}"></select>
            </label>
        </div>
        <div class="form-actions">
            <button type="submit">保存</button>
        </div>
    </form>
    <form class="panel" th:if="${form.id != null}" method="post" th:action="@{/labor-cost-rates/{id}/delete(id=${form.id})}">
        <button class="danger" type="submit">删除这条成本率</button>
    </form>
</main>
</body>
</html>
