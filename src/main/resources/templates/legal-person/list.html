<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title>法人 · 梁山集团</title>
</head>
<body>
<main>
    <div class="page-head">
        <div>
            <h1>法人</h1>
            <p class="lede">法人保存法律名称、类型和存续。公司证照不在这里重复登记；事业单位等非公司法人使用本页的登记明细。</p>
        </div>
        <a class="btn" th:href="@{/legal-persons/new}">新建法人</a>
    </div>
    <div class="panel">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>法律名称</th>
                    <th>法人类型</th>
                    <th>成立</th>
                    <th>终止</th>
                    <th>状态</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${items.isEmpty()}">
                    <td colspan="6" class="empty">还没有法人。建立公司前，先为它准备一条法人记录。</td>
                </tr>
                <tr th:each="item : ${items}">
                    <td th:text="${item.legalName}">梁山集团</td>
                    <td th:text="${item.legalPersonType}">企业法人</td>
                    <td th:text="${item.establishedAt} ?: '—'">—</td>
                    <td th:text="${item.terminatedAt} ?: '—'">—</td>
                    <td><span class="badge" th:text="${item.status}">存续</span></td>
                    <td class="actions">
                        <a th:href="@{/legal-persons/{id}/edit(id=${item.id})}">编辑</a>
                        <form class="inline" th:action="@{/legal-persons/{id}/delete(id=${item.id})}" method="post" onsubmit="return confirm('删除该法人及其登记、任期？仍被公司或股东引用时会拒绝。');">
                            <button class="danger small" type="submit">删除</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
