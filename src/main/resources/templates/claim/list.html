<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title>报销 · 梁山集团</title>
</head>
<body>
<main>
    <div class="page-head">
        <div>
            <h1>报销</h1>
            <p class="lede">报销引用已经记过的费用。批准后形成对公司欠员工本人的应付，不再生成第二笔成本。</p>
        </div>
        <a class="btn" th:href="@{/expense-claims/new}">新建报销</a>
    </div>
    <div class="panel">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>单号</th>
                    <th>类型</th>
                    <th>报销人</th>
                    <th>申请金额</th>
                    <th>审批</th>
                    <th>应付</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${items.isEmpty()}">
                    <td colspan="7" class="empty">还没有报销。项目费用和体检费用都从这里提交。</td>
                </tr>
                <tr th:each="item : ${items}">
                    <td th:text="${item.claimNumber}">CL-1</td>
                    <td th:text="${item.claimType}">体检费用</td>
                    <td th:text="${item.claimantLabel}">员工</td>
                    <td th:text="${item.claimedAmount + ' ' + item.currency}">500</td>
                    <td><span class="badge" th:text="${item.approvalStatus}">草稿</span></td>
                    <td th:text="${item.payableNumber == null ? '未形成' : item.payableNumber}">AP</td>
                    <td class="actions"><a th:href="@{/expense-claims/{id}/edit(id=${item.id})}">查看</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
