<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title>报销 · 梁山集团</title>
</head>
<body>
<main>
    <div class="page-head">
        <div>
            <h1 th:text="${form.id == null} ? '新建报销' : '报销 ' + ${form.claimNumber}">新建报销</h1>
            <p class="lede">类型至少包括项目费用和体检费用。申请金额不能超过该费用上的员工垫付。只有报销人在提交日有效的行政上级可以批准或驳回。</p>
        </div>
        <a class="btn secondary" th:href="@{/expense-claims}">返回列表</a>
    </div>
    <section class="panel" th:if="${payable != null}">
        <h2>应付</h2>
        <p>
            <span th:text="${payable.payableNumber}">AP-1</span>
            · <span th:text="${payable.payablePurpose}">员工报销</span>
            · <strong th:text="${payable.payableAmount}">500</strong>
            <span th:text="${payable.currency}">CNY</span>
            · 债权人自然人 #<span th:text="${payable.creditorPersonId}">1</span>
            · <span th:text="${payable.status}">已确认</span>
        </p>
        <p class="hint">这笔应付付给报销员工对应的自然人。付款只核销应付，不另记成本。</p>
        <form method="post" th:action="@{/expense-claims/{id}/pay(id=${form.id})}">
            <div class="grid">
                <label class="field">付款确认人
                    <select name="confirmedByEmployeeId" required>
                        <option value="">请选择</option>
                        <option th:each="choice : ${employeeChoices}" th:value="${choice.id}" th:text="${choice.label}"></option>
                    </select>
                </label>
            </div>
            <div class="form-actions">
                <button type="submit">按应付付款</button>
            </div>
        </form>
    </section>
    <form class="panel" th:object="${form}" method="post"
          th:action="${form.id == null} ? @{/expense-claims} : @{/expense-claims/{id}(id=${form.id})}">
        <div class="alert" th:if="${#fields.hasErrors()}">
            <strong>请修正后再保存</strong>
            <ul>
                <li th:each="err : ${#fields.allErrors()}" th:text="${err}">错误</li>
            </ul>
        </div>
        <p class="hint" th:if="${locked}">待审或已通过的报销不能直接改。</p>
        <input type="hidden" th:field="*{id}">
        <fieldset th:disabled="${locked}">
            <div class="grid">
                <label class="field">报销单号<input th:field="*{claimNumber}"></label>
                <label class="field">类型
                    <select th:field="*{claimType}">
                        <option th:each="item : ${claimTypes}" th:value="${item}" th:text="${item}"></option>
                    </select>
                </label>
                <label class="field">报销人
                    <select th:field="*{claimantEmployeeId}">
                        <option value="">请选择</option>
                        <option th:each="choice : ${employeeChoices}" th:value="${choice.id}" th:text="${choice.label}"></option>
                    </select>
                </label>
                <label class="field">承担公司
                    <select th:field="*{reimbursementCompanyId}">
                        <option value="">请选择</option>
                        <option th:each="choice : ${companyChoices}" th:value="${choice.id}" th:text="${choice.label}"></option>
                    </select>
                </label>
                <label class="field">币种<input th:field="*{currency}" placeholder="如 CNY"></label>
                <label class="field">依据材料
                    <select th:replace="~{fragments/document-select :: bound('sourceDocumentId')}"></select>
                </label>
            </div>
            <h2>明细</h2>
            <div id="claim-lines">
                <div class="repeat-row" th:each="row, stat : *{lines}">
                    <div class="row-tools">
                        <strong>明细</strong>
                        <label class="check"><input type="checkbox" th:field="*{lines[__${stat.index}__].removed}"> 移除</label>
                    </div>
                    <input type="hidden" th:field="*{lines[__${stat.index}__].id}">
                    <div class="grid">
                        <label class="field span-2">费用
                            <select th:field="*{lines[__${stat.index}__].costOccurrenceId}">
                                <option value="">请选择</option>
                                <option th:each="choice : ${costChoices}" th:value="${choice.id}" th:text="${choice.label}"></option>
                            </select>
                        </label>
                        <label class="field">申请金额
                            <input type="number" step="0.01" min="0" th:field="*{lines[__${stat.index}__].claimedReimbursementAmount}">
                        </label>
                    </div>
                </div>
            </div>
            <button class="secondary" type="button" onclick="addRow('claim-lines','claim-line-template')">增加明细</button>
        </fieldset>
        <div class="form-actions" th:if="${!locked}">
            <button type="submit" name="submitForApproval" value="false">保存草稿</button>
            <button type="submit" name="submitForApproval" value="true">提交审批</button>
        </div>
    </form>
    <section class="panel" th:if="${pending}">
        <h2>审批</h2>
        <form method="post" th:action="@{/expense-claims/{id}/approve(id=${form.id})}">
            <div class="grid">
                <label class="field">审批人
                    <select name="approvedByEmployeeId" required>
                        <option value="">请选择</option>
                        <option th:each="choice : ${employeeChoices}" th:value="${choice.id}" th:text="${choice.label}"></option>
                    </select>
                </label>
                <label class="field">审批时间<input type="datetime-local" name="approvedAt" required></label>
                <label class="field span-2">意见<input name="approvalComment"></label>
            </div>
            <div class="form-actions"><button type="submit">批准</button></div>
        </form>
        <form method="post" th:action="@{/expense-claims/{id}/reject(id=${form.id})}">
            <div class="grid">
                <label class="field">审批人
                    <select name="approvedByEmployeeId" required>
                        <option value="">请选择</option>
                        <option th:each="choice : ${employeeChoices}" th:value="${choice.id}" th:text="${choice.label}"></option>
                    </select>
                </label>
                <label class="field">审批时间<input type="datetime-local" name="approvedAt" required></label>
                <label class="field span-2">驳回原因<input name="approvalComment" required></label>
            </div>
            <div class="form-actions"><button class="danger" type="submit">驳回</button></div>
        </form>
    </section>
    <div id="claim-line-template" hidden>
        <div class="repeat-row">
            <div class="row-tools">
                <strong>明细</strong>
                <button class="danger small" type="button" onclick="removeRow(this)">移除</button>
            </div>
            <input type="hidden" name="lines[__INDEX__].id" value="">
            <input type="hidden" name="lines[__INDEX__].removed" value="false">
            <div class="grid">
                <label class="field span-2">费用
                    <select name="lines[__INDEX__].costOccurrenceId">
                        <option value="">请选择</option>
                        <option th:each="choice : ${costChoices}" th:value="${choice.id}" th:text="${choice.label}"></option>
                    </select>
                </label>
                <label class="field">申请金额<input type="number" step="0.01" min="0" name="lines[__INDEX__].claimedReimbursementAmount"></label>
            </div>
        </div>
    </div>
</main>
</body>
</html>
